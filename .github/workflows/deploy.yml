name: Check frontend and Go backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mkdocsweb
          POSTGRES_PASSWORD: ci-disposable-database-password
          POSTGRES_DB: mkdocsweb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkdocsweb -d mkdocsweb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - name: PostgreSQL integration tests
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://mkdocsweb:ci-disposable-database-password@localhost:5432/mkdocsweb?sslmode=disable
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o mkdocsweb .
